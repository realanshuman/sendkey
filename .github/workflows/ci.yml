name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      # Node provides the same WebCrypto API browsers do, so the Go<->browser
      # envelope interop tests run here instead of skipping.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race -count=1 ./...

      - name: Build all targets
        run: |
          go build ./...
          go build -o /dev/null ./cmd/sendkey
