<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- userSpaceOnUse, not the objectBoundingBox default: straight strokes
         (the shaft and tooth) have zero-area bounding boxes, and gradients in
         bbox units are skipped on those, which erases half the key. -->
    <linearGradient id="ember" gradientUnits="userSpaceOnUse" x1="5" y1="10" x2="27" y2="22">
      <stop offset="0" stop-color="#ffae3f"/>
      <stop offset="1" stop-color="#ff6a2b"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="#0a0908"/>
  <g fill="none" stroke="url(#ember)" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.2" cy="16" r="4.6"/>
    <path d="M14.8 16h11"/>
    <path d="M25.8 16l-4.3-4.3M25.8 16l-4.3 4.3"/>
    <path d="M19.2 16v4.4"/>
  </g>
</svg>
