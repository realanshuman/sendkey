<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- userSpaceOnUse, not the objectBoundingBox default: straight strokes
         (the shaft and tooth) have zero-area bounding boxes, and gradients in
         bbox units are skipped on those, which erases half the key. -->
    <linearGradient id="iris" gradientUnits="userSpaceOnUse" x1="4" y1="10" x2="29" y2="22">
      <stop offset="0" stop-color="#a5adff"/>
      <stop offset="1" stop-color="#7d6cf0"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="#0e0f13"/>
  <g fill="none" stroke="url(#iris)" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="9.2" cy="16" r="4.5"/>
    <path d="M13.7 16h7.6"/>
    <path d="M17.6 16v4.3"/>
  </g>
  <g fill="url(#iris)">
    <circle cx="24.9" cy="16" r="1.95"/>
    <circle cx="28.4" cy="16" r="1.35" opacity=".5"/>
  </g>
</svg>
